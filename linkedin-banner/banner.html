<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>LinkedIn Banner</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1584px; height: 396px; overflow: hidden; background: #f4f2ed; }
  .banner {
    position: relative; width: 1584px; height: 396px; overflow: hidden;
    font-family: 'IBM Plex Sans', sans-serif; color: #14263f;
    background: #f4f2ed;
  }
  /* solid block behind the profile photo */
  .block { position: absolute; left: 0; top: 0; bottom: 0; width: 330px; background: #14263f; }
  .block::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 10px; background: #d9822b; }

  .content { position: absolute; left: 820px; width: 680px; top: 62px; }
  h1 { font-size: 60px; font-weight: 700; letter-spacing: -0.01em; line-height: 1; }
  .title { margin-top: 14px; font-size: 27px; font-weight: 500; color: #3a4d68; }
  .rule { margin: 26px 0 22px; width: 72px; height: 3px; background: #d9822b; }
  .stack { font-size: 19px; font-weight: 500; color: #14263f; }
  .stack span { color: #9aa3ae; margin: 0 8px; }
  .meta { margin-top: 12px; font-size: 18px; line-height: 1.5; color: #56657a; }

  .footer {
    position: absolute; left: 820px; width: 680px; bottom: 34px;
    display: flex; justify-content: space-between; font-size: 17px; color: #14263f; font-weight: 500;
  }
  .photo { position: absolute; left: 350px; bottom: -6px; height: 410px; mix-blend-mode: multiply; }
  .footer .muted { color: #56657a; font-weight: 400; }
</style>
</head>
<body>
<div class="banner">
  <div class="block"></div>

  <div class="content">
    <h1>Najeeb Ullah</h1>
    <div class="title">Full-Stack Developer (MERN &amp; Next.js)</div>
    <div class="rule"></div>
    <div class="stack">Next.js<span>/</span>React<span>/</span>TypeScript<span>/</span>Node.js<span>/</span>Express.js<span>/</span>MongoDB</div>
    <div class="meta">Turning ideas into fast, clean and scalable web experiences.</div>
  </div>

  <img class="photo" src="photo.png" alt="Najeeb Ullah">

  <div class="footer">
    <div>Najeeb13750@gmail.com</div>
    <div class="muted">Open to new opportunities</div>
  </div>
</div>
</body>
</html>
