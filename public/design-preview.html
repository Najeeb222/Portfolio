<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Project card preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#ecf0f3; --ink:#1e2125; --muted:#8a9099; --red:#ff014f; }
  * { box-sizing:border-box; margin:0; padding:0 }
  body { background:var(--bg); font-family:Inter,sans-serif; -webkit-font-smoothing:antialiased }
  .grid { max-width:1180px; margin:0 auto; padding:64px 24px; display:grid; grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr)); gap:48px 28px }
  @media (max-width:600px) { .grid { padding:32px 16px } .media { padding:18px 18px 0 } }

  .card { display:block; color:inherit; text-decoration:none }
  .media { position:relative; aspect-ratio:4/3; border-radius:14px; overflow:hidden; padding:28px 28px 0; display:flex; align-items:flex-end }
  .media img { width:100%; border-radius:8px 8px 0 0; box-shadow:0 20px 40px -20px rgba(15,23,42,.45); transition:transform .5s cubic-bezier(.22,1,.36,1) }
  .card:hover .media img { transform:translateY(-8px) }

  .info { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding-top:16px }
  .info h3 { font-family:Montserrat; font-size:18px; font-weight:600; color:var(--ink); letter-spacing:-.01em }
  .info p { font-size:14px; color:var(--muted); margin-top:4px }
  .arrow { flex-shrink:0; width:34px; height:34px; border-radius:50%; border:1px solid #cfd6dd; display:grid; place-items:center; color:var(--ink); transition:all .25s }
  .card:hover .arrow { background:var(--ink); border-color:var(--ink); color:#fff; transform:rotate(-45deg) }
</style>
</head>
<body>
<div class="grid">
  <a class="card" href="#"><div class="media" style="background:#dde6f1"><img src="/assets/images/projects/medilifeglobal.jpg" alt=""></div>
    <div class="info"><div><h3>Medilife Global</h3><p>Healthcare · Next.js</p></div><span class="arrow">→</span></div></a>

  <a class="card" href="#"><div class="media" style="background:#e9e3d9"><img src="/assets/images/projects/medilifeclinic.jpg" alt=""></div>
    <div class="info"><div><h3>Medilife Wellness Clinic</h3><p>Healthcare · Next.js</p></div><span class="arrow">→</span></div></a>

  <a class="card" href="#"><div class="media" style="background:#dfece4"><img src="/assets/images/projects/storemate.jpg" alt=""></div>
    <div class="info"><div><h3>StoreMate POS</h3><p>SaaS · MERN</p></div><span class="arrow">→</span></div></a>

  <a class="card" href="#"><div class="media" style="background:#f1e4e6"><img src="/assets/images/projects/mircloths.jpg" alt=""></div>
    <div class="info"><div><h3>Mir Cloths</h3><p>E-commerce · React</p></div><span class="arrow">→</span></div></a>

  <a class="card" href="#"><div class="media" style="background:#e1e6ef"><img src="/assets/images/projects/nexzon.jpg" alt=""></div>
    <div class="info"><div><h3>Nexzon Shipping</h3><p>Business website · React</p></div><span class="arrow">→</span></div></a>

  <a class="card" href="#"><div class="media" style="background:#dcefee"><img src="/assets/images/projects/soofiy.jpg" alt=""></div>
    <div class="info"><div><h3>Soofy</h3><p>Learning platform · React</p></div><span class="arrow">→</span></div></a>
</div>
</body>
</html>
